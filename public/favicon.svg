<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#emeraldBg)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Logo Monogram M -->
  <text x="32" y="44" 
        font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" 
        font-size="30" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="-1"
        filter="url(#glow)">M</text>
  
  <!-- Accent Dot -->
  <circle cx="48" cy="42" r="3.5" fill="#a7f3d0" />
</svg>
